[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtimeline"
version = "0.1.0"
description = "Turn prescriptions and case sheets into a chronological patient history"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pillow>=10",
]

[project.optional-dependencies]
cloud = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
medtimeline = "medtimeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medtimeline = ["demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
