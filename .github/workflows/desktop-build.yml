name: desktop installers
on:
  push:
    branches: [desktop-app, main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple silicon
            name: mac-apple-silicon
            bundles: dmg
          - os: macos-13       # Intel Macs
            name: mac-intel
            bundles: dmg
          - os: windows-latest
            name: windows
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Freeze the engine
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cloud]" pyinstaller
          python scripts/freeze.py
      - name: Check the frozen engine answers
        shell: bash
        run: |
          bin=$(ls app/src-tauri/binaries/medtimeline-engine-*)
          printf '%s\n' '{"id":1,"method":"info","params":{}}' '{"id":2,"method":"demo","params":{}}' \
            | "$bin" serve --home "$RUNNER_TEMP/engine-home" > "$RUNNER_TEMP/out.txt"
          grep -q '"extractors"' "$RUNNER_TEMP/out.txt"
          grep -q 'Meera Nair' "$RUNNER_TEMP/out.txt"
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: patient-history-timeline-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
